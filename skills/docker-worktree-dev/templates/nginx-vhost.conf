# ==============================================================================
# nginx vhost (reference) — one server block per browser-facing service
# ==============================================================================
# `make dev` generates this automatically; this file documents the shape and
# the why. Host prerequisites: nginx installed, /etc/nginx/sites-enabled exists
# and is `include`d from the http{} block of nginx.conf, and the process
# reloading it can write to sites-enabled (run make as that user, or via sudo).
# ==============================================================================

server {
    listen 80;
    server_name ${SERVICE_HOST};                 # nip.io host, e.g. proj-branch-api.127.0.0.1.nip.io

    # Let file uploads through (default is 1m → 413 on larger bodies).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:${SERVICE_PORT};   # worktree's mapped host port
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # WebSocket / HMR upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for SSE / streaming endpoints (e.g. AI token streams).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
